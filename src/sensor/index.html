<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mochi Sensor</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    video { position: absolute; width: 320px; height: 240px; object-fit: cover; transform: scaleX(-1); opacity: 0; }
    /* ⚠️ id 不能叫 dbg：Emscripten 的 wasm 加载器里有 `typeof dbg !== "undefined" && dbg(...)`，
       而带 id 的元素会自动成为 window.dbg（object），于是它去调用一个 DOM 元素 →
       "dbg is not a function"，MediaPipe 初始化必然失败。 */
    #sensorDbg { position: absolute; left: 4px; top: 4px; color: #0f0; font: 11px monospace; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="sensorDbg"></div>
  <script src="../pet/live/math.js"></script>
  <script src="../pet/live/gesture.js"></script>
  <script src="sensor.js"></script>
</body>
</html>
