name: Deploy Website

# 把 website/ 目录发布成 GitHub Pages 站点
# 启用方式：仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”
# 发布地址：https://<用户名>.github.io/<仓库名>/

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 website 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
